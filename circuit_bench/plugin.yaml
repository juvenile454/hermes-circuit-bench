name: circuit-bench
version: 0.1.1
manifest_version: 2
api_version: 1
description: "ESP32 workbench for Hermes: checks pins against Espressif data, sizes parts, draws schematics, plans soldering, builds, flashes and monitors firmware and decodes crashes. Every value comes from code with its source: 180 cited modules, a simulation mode, tested on real boards, live Desktop bench."
author: "Timo (juvenile454)"
license: MIT
homepage: https://github.com/juvenile454/hermes-circuit-bench
tags: [esp32, electronics, embedded, platformio, hardware, desktop]
requires_hermes: ">=0.22.5"
provides_tools: [bench_project, bench_pins, bench_calc, bench_schematic, bench_solder, bench_board, bench_crash]
provides_hooks: [pre_tool_call]
config_schema:
  allow_flash:
    type: bool
    default: false
    label: "Allow flashing real boards"
    description: "Off by default. When off, nothing can write firmware to a real board (agent tool and Bench UI). Simulated boards (sim://) are not affected. When on, the Bench always asks in its own dialog, and the agent asks through Hermes' approval (which a session /yolo skips; see the README)."
  approve_serial:
    type: bool
    default: true
    label: "Ask before opening serial ports"
    description: "Ask for approval before the agent detects a board or opens a serial monitor. Opening a port can reset the board (DTR/RTS)."
  hardware_access:
    type: bool
    default: true
    label: "Access real hardware"
    description: "When off, only simulated boards (sim://) are visible; real serial ports, esptool and uploads are refused."
  default_baud:
    type: int
    default: 115200
    label: "Default baud rate"
    description: "Serial monitor baud rate when none is given."
  monitor_max_seconds:
    type: int
    default: 120
    label: "Monitor time limit (seconds)"
    description: "Longest serial monitor run in seconds (1-3600, default 120). Hermes ends a tool call after its own deadline (420 s by default), so the monitor listens at most that deadline minus 20 s and warns with `monitor_capped` when it cuts a run."
  build_timeout_seconds:
    type: int
    default: 900
    label: "Build time limit (seconds)"
    description: "PlatformIO build timeout. The first build of a platform can take several minutes."
  pio_path:
    type: str
    default: ""
    label: "PlatformIO executable"
    description: "Absolute path to pio. Empty: search PATH, ~/.platformio/penv/bin and ~/.local/bin."
  esptool_path:
    type: str
    default: ""
    label: "esptool executable"
    description: "Absolute path to esptool. Empty: search PATH and ~/.local/bin."
