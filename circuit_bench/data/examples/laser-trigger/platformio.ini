; Circuit Bench example "laser-trigger" for the ESP32-S3-DevKitC-1 (see README.md).
; Offline build: pio run -e s3   (upload only through Circuit Bench or after reading the README)

[platformio]
default_envs = s3

[env:s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Serial on the native USB port (USB-Serial/JTAG), which also gives the automatic reset for uploads
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
